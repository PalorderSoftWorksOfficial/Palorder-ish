name: Shell script checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check scripts
        shell: sh
        run: |
          set -eu
          find runtime -type f -exec sh -n {} \;
          sh -n install.sh
          sh -n uninstall.sh
      - name: ShellCheck
        run: shellcheck -s sh install.sh uninstall.sh runtime/*
